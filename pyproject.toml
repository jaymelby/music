[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "videoscore"
version = "0.1.0"
description = "Background music for videos, synthesized from scratch and synced to scene transitions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
videoscore = "videoscore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
